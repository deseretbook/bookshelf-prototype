<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Compare Study Plan Pages</title>
<style>
:root { color-scheme: light; --bg: #FAF8F4; --fg: #23271F; --muted: #6B6F63; --line: #D6D0C4; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1000px; margin: 0 auto; padding: 14px 8px 28px; }
h1 { font-size: 17px; margin: 0 0 2px; text-align: center; }
.sub { color: var(--muted); text-align: center; margin: 0 0 12px; font-size: 13px; }
.pair { display: flex; gap: 8px; align-items: flex-start; }
figure { flex: 1 1 0; min-width: 0; margin: 0; text-align: center; }
figcaption { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6%/2.8%; }
</style>
</head>
<body>
<main>
  <h1>Two versions of the study plan page</h1>
  <p class="sub">Pinch to zoom in and out. Decide which one you prefer.</p>
  <div class="pair">
    <figure><figcaption>Version A</figcaption><img src="images/version-a.png" alt="Version A of the study plan page"></figure>
    <figure><figcaption>Version B</figcaption><img src="images/version-b.png" alt="Version B of the study plan page"></figure>
  </div>
</main>
</body>
</html>
