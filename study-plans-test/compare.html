<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Compare Study Plan Pages</title>
<style>
:root { color-scheme: light; --bg: #FAF8F4; --fg: #23271F; --muted: #6B6F63; --line: #D6D0C4; --accent: #2E6B50; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
.sub { color: var(--muted); text-align: center; margin: 0 0 20px; }
.pair { display: flex; gap: 8px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
.col { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.label { font-weight: 600; font-size: 17px; }
.frame { width: 440px; height: 870px; overflow: hidden; }
iframe { width: 440px; height: 910px; margin-top: -40px; border: 0; display: block; background: var(--bg); }
button { font: inherit; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
@media (max-width: 460px) { .frame, iframe { width: 100%; } .col { width: 100%; } }
</style>
</head>
<body>
<main>
  <h1>Two versions of the study plan page</h1>
  <p class="sub">Tap around in each phone, then decide which one you prefer.</p>
  <div class="pair">
    <section class="col" aria-label="Version A">
      <div class="label">Version A</div>
      <div class="frame"><iframe id="fa" src="week.html" title="Version A"></iframe></div>
      <button type="button" onclick="document.getElementById('fa').src='week.html'">Start over</button>
    </section>
    <section class="col" aria-label="Version B">
      <div class="label">Version B</div>
      <div class="frame"><iframe id="fb" src="days.html" title="Version B"></iframe></div>
      <button type="button" onclick="document.getElementById('fb').src='days.html'">Start over</button>
    </section>
  </div>
</main>
</body>
</html>
