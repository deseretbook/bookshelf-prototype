<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>redeem-gift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&family=Lora:ital,wght@0,400;0,500;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..400,0..1,0&display=swap">
<style>
/* Layout: the Deseret Book storefront rendered inside a resizable "site" container (container queries switch desktop/mobile), with a floating prototype panel on top. Single light look on purpose: it mirrors the live site. */
:root{
  --charcoal:#3A3633; --stone:#56504B; --muted:#8A837C; --granite:#D8D5D2; --line:#E7E3DE;
  --page:#FFFFFF; --pearl:#F4F0EA; --sand:#E0D5C6; --white:#FFFFFF; --placeholder:#E9E4DE;
  --gold:#966D2F; --gold-ink:#7C5A26; --gold-soft:#F3EADC; --teal:#1D8574; --teal-soft:#E7F2EF;
  --promo:#1A7FA8; --nav:#3A3633; --hero-bg:#F7F4F0; --bronze:#A66900; --sale:#CF3037; --sale-soft:#FBEAEA; --trial:#C18630;
  --panel:#1F1C1A; --panel-2:#2B2725; --panel-ink:#F4F0EA; --panel-muted:#A9A199;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --icon:"Material Symbols Outlined";
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--charcoal)}
body{font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.ms{font-family:var(--icon);font-weight:300;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 300,"GRAD" 0,"opsz" 24;user-select:none;overflow:hidden;width:1em;flex:none}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- stage (device frame) ---------- */
.stage{padding-bottom:96px}
.stage.framed{padding:24px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));background:#ECE8E3}
.site{container-type:inline-size;container-name:site;background:var(--page);margin:0 auto;min-height:100vh}
.stage.framed .site{max-width:390px;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(40,30,20,.18);min-height:780px}
.wrap{max-width:1208px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- header (Figma: promo 32 · header 72 · nav 40) ---------- */
.promo{background:var(--promo);color:#fff;font-size:12px;text-align:center;min-height:32px;display:flex;align-items:center;justify-content:center;padding:6px 40px;position:relative}
.promo b{text-decoration:underline;font-weight:700;letter-spacing:.02em;margin-right:4px}
.promo u{cursor:pointer;margin-left:4px}
.promo .x{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:18px}
.hdr{background:var(--white)}
.hdr .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:72px}
.logo{display:inline-flex;align-items:center;gap:12px;font-family:var(--serif);font-size:28px;color:var(--charcoal);text-decoration:none;background:none;border:0;padding:0}
.mark{width:38px;height:38px;border-radius:50%;background:var(--charcoal);color:#fff;display:inline-grid;place-items:center;font-family:var(--serif);font-size:16px;letter-spacing:-.02em;flex:none}
.util{display:flex;justify-content:flex-end;align-items:center;gap:16px}
.util .srch{display:flex;align-items:center;gap:6px;border-left:1px solid var(--granite);padding-left:16px;height:30px;font-size:11px;text-transform:uppercase}
.util .srch .ms{font-size:16px}
.util .acct{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase}
.bag{position:relative;width:30px;height:30px;display:grid;place-items:center;background:none;border:0;padding:0}
.bag .ms{font-size:22px}
.bag i{position:absolute;top:0;right:0;background:var(--trial);color:#fff;font-style:normal;font-size:9px;width:14px;height:14px;border-radius:50%;display:grid;place-items:center;letter-spacing:0}
.menu-btn{display:none;background:none;border:0;padding:0}
.nav{background:var(--nav)}
.nav ul{list-style:none;margin:0;padding:0;display:flex;justify-content:center;flex-wrap:wrap;gap:4px 30px;min-height:40px;align-items:center}
.nav button{background:none;border:0;color:#fff;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:0}
.nav button.on{text-decoration:underline;text-underline-offset:6px}
.msearch{display:none}

/* ---------- common UI ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 28px;border-radius:999px;border:1px solid var(--gold);background:var(--gold);color:#fff;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;transition:background .15s}
.btn:hover{background:var(--gold-ink);border-color:var(--gold-ink)}
.btn.outline{background:var(--white);color:var(--gold)}
.btn.outline:hover{background:var(--gold-soft)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{color:var(--teal);text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0;cursor:pointer}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance;color:var(--charcoal)}
.h-page{font-size:40px;line-height:1.15}
.h-card{font-size:26px;line-height:1.2}
.small{font-size:12px;color:var(--stone)}
.cap{font-size:13px;color:var(--stone)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--charcoal)}
.field .box{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;background:var(--white);border:1px solid var(--granite);border-radius:8px}
.field input,.field textarea,.field select{border:0;background:none;outline:none;flex:1;min-width:0;font-size:15px}
.field textarea{resize:vertical;min-height:70px;padding:10px 0}
.field .box.ta{height:auto;align-items:flex-start}
.field.err label{color:var(--sale)}
.field.err .box{border-color:var(--sale);box-shadow:0 0 0 1px var(--sale) inset}
.errmsg{display:flex;gap:6px;color:var(--sale);font-size:12px;align-items:flex-start}
.errmsg .ms{font-size:16px}
.alert{display:flex;gap:10px;padding:14px 16px;border-radius:8px;background:var(--pearl);font-size:13px;color:var(--charcoal);align-items:flex-start}
.alert .ms{font-size:18px;margin-top:1px}
.card .alert:not(.error):not(.ok){background:transparent;padding:4px 12px}
.alert.error{background:var(--sale-soft);color:var(--charcoal)}
.alert.error .ms{color:var(--sale)}
.alert.ok{background:var(--teal-soft)}
.alert.ok .ms{color:var(--teal)}
.rows{display:flex;flex-direction:column}
.row-s{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--granite);font-size:14px}
.row-s b{font-weight:700}
.row-s .v{text-align:right;display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.tag{background:var(--charcoal);color:#fff;font-size:10px;font-weight:900;letter-spacing:.1em;padding:3px 8px;border-radius:999px}
.pill{display:inline-block;background:var(--teal);color:#fff;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.pill.trial{background:var(--teal-soft);color:var(--teal);text-transform:none;letter-spacing:.01em;font-size:11px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;cursor:pointer}
.check input{appearance:none;width:18px;height:18px;border:1.5px solid var(--stone);border-radius:4px;flex:none;margin:1px 0 0;background:var(--white);display:grid;place-items:center}
.check input:checked{background:var(--gold);border-color:var(--gold)}
.check input:checked::after{content:"";width:5px;height:9px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(45deg) translate(-1px,-1px)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--charcoal);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}

/* ---------- home (Figma: hero 400 · card 420 · promos 3×365, gap 40) ---------- */
.btn.sm{height:40px;padding:0 20px;font-size:13px;letter-spacing:.05em}
.hero{position:relative;height:400px;background:var(--hero-bg);overflow:hidden}
.hero .slide{position:absolute;inset:0}
.hero .slide img{display:block;width:100%;height:100%;object-fit:cover}
.hcard{position:absolute;right:8%;top:50%;transform:translateY(-50%);width:420px;max-width:calc(100% - 32px);background:var(--hero-bg);border-radius:4px;padding:32px;display:flex;flex-direction:column;gap:18px}
.hcard h1{font-size:38px;line-height:1.15}
.hcard p{margin:0;font-size:17px;line-height:1.35;color:#000}
.hcard p b{font-weight:700}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:#fff;border:0;display:grid;place-items:center;z-index:2;color:var(--charcoal)}
.arrow .ms{font-size:20px}
.arrow.l{left:16px}.arrow.r{right:16px}
.hdots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
.hdots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:#fff}
.hdots button.on{background:var(--charcoal)}
.promos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;padding-block:28px 40px}
.pcard{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;min-width:0}
.pcard img{display:block;width:100%;max-width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:4px}
.pcard h3{font-size:30px;line-height:1.2}
.pcard button{background:none;border:0;padding:0;color:var(--bronze);font-size:12px;text-transform:uppercase}

/* shared: how it works + questions */
.faq{border-top:1px solid var(--granite)}
.faq details{border-bottom:1px solid var(--granite)}
.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;cursor:pointer;font-size:15px}
.faq summary::-webkit-details-marker{display:none}
.faq details[open] summary .ms{transform:rotate(180deg)}
.faq p{margin:0 0 16px;color:var(--stone);font-size:14px;max-width:80ch}
.how{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.how li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.how .n{width:24px;height:24px;border-radius:50%;background:var(--placeholder);display:grid;place-items:center;font-size:11px;flex:none;margin-top:1px}
/* ---------- offers (Figma: left 600 · card 520 · questions full width) ---------- */
.off{display:grid;grid-template-columns:minmax(0,600px) minmax(0,520px);justify-content:space-between;column-gap:48px;row-gap:28px;grid-template-areas:"intro card" "how card";padding-block:40px 0;align-items:start}
.o-intro{grid-area:intro;display:flex;flex-direction:column;gap:20px;min-width:0}
.o-how{grid-area:how;display:flex;flex-direction:column;gap:16px;min-width:0}
.o-card{grid-area:card;min-width:0}
.otitle{display:flex;align-items:center;gap:16px}
.otitle img{display:none;width:120px;height:auto;flex:none}
.o-intro .lead{font-size:17px;color:var(--charcoal);max-width:520px}
.ohero{display:block;width:100%;max-width:600px;height:auto}
.how.o .n{background:none;border:1px solid var(--charcoal)}
.qs{padding-block:64px;display:flex;flex-direction:column;gap:8px}
.qs h2{font-size:30px}
.qs .faq summary{padding:16px 0 6px}
.qs .faq p{font-size:12px;margin:0 0 16px;max-width:none}
.gc{background:var(--hero-bg);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:16px}
.gc>h2{font-size:26px;padding-top:4px}
.gbox{background:#fff;padding:16px;display:flex;flex-direction:column;gap:16px}
.gstep{display:flex;align-items:center;gap:10px;font-size:13px}
.gstep .n{width:22px;height:22px;border-radius:50%;background:var(--placeholder);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.gsteprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lopts{display:flex;flex-direction:column;gap:12px}
.lopt{display:flex;gap:12px;align-items:center;border:1px solid var(--granite);border-radius:4px;padding:12px 16px;background:#fff;text-align:left;width:100%}
.lopt .rd{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--charcoal);flex:none;display:grid;place-items:center}
.lopt.on{border:2px solid var(--teal);padding:11px 15px}
.lopt.on .rd{border-color:var(--teal)}
.lopt.on .rd::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--teal)}
.lopt span{display:flex;flex-direction:column;gap:2px}
.lopt b{font-weight:400;font-size:15px}
.lopt.on b{font-weight:700;color:var(--teal)}
.lopt small{font-size:13px;color:var(--stone)}
.stp{display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
.stp button{width:32px;height:32px;border-radius:50%;border:0;background:var(--hero-bg);display:grid;place-items:center;color:var(--charcoal)}
.stp button[disabled]{color:var(--granite);cursor:default}
.optl{background:var(--teal-soft);color:var(--teal);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.rrow{background:var(--hero-bg);border-radius:4px}
.rrow-h{display:flex;align-items:center;gap:12px;padding:16px 14px;width:100%;background:none;border:0;text-align:left}
.rrow-h .av{width:32px;height:32px;border-radius:50%;background:var(--sand);display:grid;place-items:center;flex:none}
.rrow-h .av .ms{font-size:18px}
.rrow-h .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rrow-h b{font-size:17px;font-weight:700}
.rrow-h small{font-size:13px;color:var(--stone)}
.rrow-b{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.rrow-b .field label{font-size:12px;letter-spacing:.05em}
.rrow-b .field .box{border:0}
.rrow-b .field.err .box{box-shadow:0 0 0 1.5px var(--sale) inset}
.rrow-b textarea{min-height:84px}
.check.teal input:checked{background:var(--teal);border-color:var(--teal)}
.gadded{background:#FAF9F7;border-radius:4px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.gadded>.ms{color:var(--teal)}
.gadded .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:15px}
.gadded small{font-size:12px}
.gadded small b{font-weight:700}
.gadded .lk{display:flex;gap:16px;font-size:13px}
.gnote{font-size:13px;margin:0}
.gmail{display:flex;gap:12px;align-items:flex-start;font-size:13px}
.gmail .ms{color:var(--gold)}
.ghr{height:1px;background:var(--granite)}
.mob-only{flex-direction:column;gap:32px}
.two.rd{padding-bottom:0}

/* ---------- shared two-column layout + cards (redeem, cart) ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:56px;padding-block:40px 64px;align-items:start}
.leftcol{display:flex;flex-direction:column;gap:24px;min-width:0}
.offer-art{background:linear-gradient(160deg,#F6EFE5,#EADCC8);border-radius:6px;padding:28px;display:grid;place-items:center}
.offer-art img{width:min(100%,440px);height:auto}
.lead{font-size:16px;color:var(--stone);margin:0;max-width:60ch}
.card{background:var(--hero-bg);border-radius:4px;padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.sub-h{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline}
.sub-h span{font-weight:400;letter-spacing:.02em;text-transform:none;color:var(--stone);font-size:12px}
.lengths{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.len{background:var(--white);border:1px solid var(--granite);border-radius:8px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:2px}
.len b{font-weight:500;font-size:15px}
.len span{font-size:13px;color:var(--stone)}
.len.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:var(--gold-soft)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--granite);border-radius:999px;background:var(--white);height:44px}
.stepper button{width:44px;height:44px;border:0;background:none;display:grid;place-items:center}
.stepper button[disabled]{opacity:.3;cursor:default}
.stepper output{min-width:32px;text-align:center;font-weight:500;font-variant-numeric:tabular-nums}
.rcp{background:var(--white);border:1px solid var(--granite);border-radius:8px}
.rcp-head{display:flex;align-items:center;gap:10px;padding:14px 16px;width:100%;background:none;border:0;text-align:left}
.rcp-head .who{flex:1;min-width:0;display:flex;flex-direction:column}
.rcp-head .who b{font-weight:500;font-size:14px}
.rcp-head .who span{font-size:12px;color:var(--stone);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcp-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:16px}
.rcp-saved{display:flex;align-items:center;gap:12px;padding:14px 16px}
.rcp-saved .who{flex:1;min-width:0;font-size:14px}
.rcp-saved .who small{display:block;color:var(--stone);font-size:12px}
.rcp-actions{display:flex;gap:14px;font-size:13px}
.addgift{align-self:flex-start;background:none;border:0;color:var(--teal);display:flex;gap:6px;align-items:center;padding:0;font-size:14px}
.sticky-cta{display:flex;flex-direction:column;gap:10px}
.added{display:flex;gap:12px;align-items:center;background:var(--white);border:1px solid var(--teal);border-radius:8px;padding:14px 16px}
.added .ms{color:var(--teal)}

/* ---------- cart ---------- */
.cart{padding-block:40px 64px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:40px;align-items:start}
.line{display:flex;gap:16px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:6px;padding:16px}
.line img{width:64px;height:auto;flex:none}
.line .t{flex:1;min-width:0}
.line .t b{font-weight:500;display:block}
.line .t small{color:var(--stone)}

/* ---------- redeem ---------- */
.banner{display:flex;gap:16px;align-items:center;background:#FAF9F6;border-radius:4px;padding:16px;min-height:120px}
.banner img{width:88px;height:88px;border-radius:4px;object-fit:cover;flex:none}
.banner .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.banner h3{font-size:24px}
.banner .from{display:flex;align-items:center;gap:6px;font-size:13px}
.banner .from .ms{font-size:16px;color:var(--teal)}
.banner q{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--stone);quotes:none}
.signed{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.signed .ms{font-size:18px}
.progress{display:flex;align-items:center;gap:10px;font-size:12px}
.progress .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--granite);display:grid;place-items:center;font-size:11px;background:var(--white);flex:none}
.progress .dot.on{background:var(--teal);border-color:var(--teal);color:#fff}
.progress .dot.done{border-color:var(--teal);color:var(--teal)}
.progress .bar{flex:1;height:1px;background:var(--granite)}
.progress .bar.done{background:var(--teal)}
.progress b{font-weight:700}
.back{display:inline-flex;align-items:center;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;padding:0;align-self:flex-start}
.back .ms{font-size:16px}
.where{background:var(--white);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;font-size:13px}

  } else {
    const rule=(ok,t)=>`<div>${ok?ic("check_circle","ok"):ic("radio_button_unchecked")}<span>${t}</span></div>`;
    body=`<div class="modal" role="dialog" aria-modal="true" aria-label="Create account"><button class="x" data-act="closemodal" aria-label="Close">${ic("close")}</button>${head("Create Account")}
      <div class="mcols"><div class="mcol"><div class="pair">${f("ca-fn","First name","Jane")}${f("ca-ln","Last name","Smith")}</div>${f("ca-ph","Phone","(000) 000-0000","tel")}${f("ca-em","Email","jane@example.com","email")}${f("ca-em2","Confirm email","jane@example.com","email")}</div>

  return `<div class="ov ${framed()?"framed":""}" data-act="ovclick">${body}</div>`;
}

function seg(key,opts){ return `<div class="seg">${opts.map(([v,l])=>`<button class="${String(S[key])===String(v)?"on":""}" data-set="${key}" data-v="${v}">${l}</button>`).join("")}</div>`; }
function tog(key,label){ return `<div class="tog"><span>${label}</span><button class="sw ${S[key]?"on":""}" role="switch" aria-checked="${!!S[key]}" aria-label="${label}" data-toggle="${key}"></button></div>`; }
function panel(){
  const fab=`<button class="fab" data-act="panel" aria-expanded="${S.panel}">${ic("tune")}Prototype</button>`;
  if(!S.panel) return fab;
  const screens=[["home","Home"],["offers","Offers"],["cart","Cart"],["redeem-code","Redeem · Code"],["redeem-signin","Sign in"],["redeem-create","Create account"],["redeem-confirm","Confirm"],["redeem-success","Success"],["short","Gift < plan"],["short-pro","Gift < plan · prorated"],["emails","Emails"]];
  const cur=S.lastJump&&S.screen==="redeem"&&S.step==="confirm"?S.lastJump:S.screen==="redeem"?(S.modal?"redeem-"+(S.modal==="signin"?"signin":"create"):"redeem-"+S.step):S.screen;
  return fab+`<aside class="panel" aria-label="Prototype controls"><h4>Prototype<button class="link" style="color:var(--panel-muted)" data-act="panel" aria-label="Close">${ic("close")}</button></h4>

    <div class="grp"><span class="lbl">Account</span>${seg("account",[["active","Active"],["inactive","Not active · card on file"],["nocard","No card on file"],["new","New member"]])}</div>
    <div class="grp">${tog("signedIn","Already signed in")}${tog("platinum","Platinum member")}${tog("message","Buyer added a message")}</div>
    <div class="grp"><span class="lbl">Code error</span>${seg("codeError",[["none","None"],["invalid","Invalid"],["used","Used"],["notactive","Not active"],["locked","Locked"]])}<p class="hint">Shows after Continue on the code step.</p></div>
    <div class="grp"><span class="lbl">Gift length</span>${seg("giftLen",[[12,"1 year"],[6,"6 months"],[3,"3 months"]])}${tog("prorate","Prorated first year (proposal)")}<p class="hint">With a 3- or 6-month gift and Yearly selected, shows the “What your gift covers” breakdown.</p></div>
    <div class="grp"><span class="lbl">Device</span>${seg("device",[["auto","Fit window"],["desktop","Desktop"],["mobile","Mobile"]])}</div>

const ROUTES=["home","offers","cart","redeem","emails"];
function render(keepScroll=true){
  const y=window.scrollY;
  S.mobileView=framed()||window.innerWidth<=720;
  const body={home,offers,cart,redeem,emails}[S.screen]();
  const acctE=(INBOX[S.mailBox||"buyer"]);
  const top=S.screen==="emails"?`<div class="mtop"><button class="iconbtn" aria-label="Menu">${ic("menu")}</button><span class="mlogo">${ic("mail","fill")}Mail</span><div class="msearch">${ic("search")}<span>Search mail</span>${ic("tune")}</div><button class="link mback" data-go="home">Back to deseretbook.com</button><span class="mme" title="${acctE.addr}">${acctE.name[0]}</span></div>`:header();
  $("#app").innerHTML=`<div class="stage ${framed()?"framed":""}"><div class="site">${top}<main>${body}</main>${S.screen==="emails"?"":footer()}</div></div>`+modal()+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:"");
  $("#ui").innerHTML=panel();
  // mobile: move How it works below the card on redeem
  const site=$(".site"); const mob=site.clientWidth<=720;
  document.querySelectorAll(".mob-only").forEach(el=>el.style.display=mob&&S.screen==="redeem"&&S.step!=="success"?"flex":"none");
  if(S.screen==="offers"){ const mt=$("#mt"); if(mt){ mt.style.display=mob?"block":"none"; mt.textContent="Gift a Subscription"; } }
  if(keepScroll) window.scrollTo(0,y); else window.scrollTo(0,0);
}
function go(screen,extra={}){ Object.assign(S,{screen,modal:null,toast:null},extra); try{ if(location.hash!=="#"+screen) history.replaceState(null,"","#"+screen); }catch(e){} render(false); }
function startRedeem(entry,extra={}){ go("redeem",Object.assign({entry,step:"code",shownErr:null,codeEmpty:false,codeVal:entry==="link"?CODE:"",consent:false,consentErr:false,changeCard:false},extra)); }
let toastT;
function toast(msg){ S.toast=msg; render(); clearTimeout(toastT); toastT=setTimeout(()=>{S.toast=null;render();},2600); }

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-act],[data-set],[data-toggle],[data-jump],[data-mail]"); if(!t) return;
  if(t.dataset.act==="ovclick"&&e.target!==t) return;
  if(t.dataset.go){ const g=t.dataset.go; if(g==="redeem-manual") startRedeem("manual"); else if(g==="redeem-link") startRedeem("link"); else go(g); return; }
  if(t.dataset.mail){ const id=t.dataset.mail; S.readMail=Object.assign({},S.readMail,{[id]:true}); go("emails",{email:id,mailOpen:true,mailBox:boxOf(id)}); return; }
  if(t.dataset.set){ const k=t.dataset.set, v=t.dataset.v; S[k]=k==="giftLen"?Number(v):v; if(k==="codeError") S.shownErr=null; if(k==="entry"&&S.screen==="redeem"){ startRedeem(v); return; } if(k==="account"&&v==="active") S.plan="monthly"; render(); return; }
  if(t.dataset.toggle){ const k=t.dataset.toggle; S[k]=!S[k]; if(k==="prorate"&&S[k]) S.plan="yearly"; if(k==="signedIn"&&!S[k]&&S.screen==="redeem") S.step="code"; render(); return; }
  if(t.dataset.jump){ const j=t.dataset.jump;
    if(j==="emails"){ go("emails",{mailOpen:false}); return; }
    if(["home","offers","cart"].includes(j)){ go(j); return; }
    if(j==="short"||j==="short-pro"){ go("redeem",{step:"confirm",signedIn:true,giftLen:S.giftLen===12?3:S.giftLen,plan:"yearly",prorate:j==="short-pro",account:S.account==="active"?"inactive":S.account,modal:null,shownErr:null,consent:false,consentErr:false,changeCard:false,lastJump:j}); return; }
    S.lastJump=null;
    const step=j.replace("redeem-","");
    if(step==="code") startRedeem(S.entry);
    else if(step==="signin"||step==="create"){ startRedeem(S.entry,{signedIn:false}); S.modal=step; render(); }
    else { go("redeem",{step,signedIn:true,modal:null,shownErr:null}); }
    return; }
  const a=t.dataset.act, i=Number(t.dataset.i);
  switch(a){
    case "panel": S.panel=!S.panel; render(); break;
    case "mailbox": S.mailBox=t.dataset.box; S.mailOpen=false; render(); break;
    case "mailback": S.mailOpen=false; render(); break;
    case "slide": S.slide=((S.slide||0)+Number(t.dataset.d)+SLIDES.length)%SLIDES.length; render(); break;
    case "slideto": S.slide=Number(t.dataset.k); render(); break;
    case "totop": window.scrollTo({top:0,behavior:"smooth"}); break;
    case "reset": { const keep={panel:true,device:S.device}; S=JSON.parse(JSON.stringify(DEFAULTS)); Object.assign(S,keep); go("home"); break; }
    case "len": S.offerLen=Number(t.dataset.m); S.formTouched=true; render(); break;
    case "inc": if(S.gifts.length<10){ const r=blankRecip(); if(S.sameMsg){ r.msg=S.gifts[0].msg; r.from=S.gifts[0].from; } S.gifts.push(r); S.formTouched=true; render(); } break;
    case "dec": if(S.gifts.length>1){ S.gifts.pop(); if(S.gifts.length===1) S.sameMsg=false; S.formTouched=true; render(); } break;
    case "rtog": { const open=!S.gifts[i].open; S.gifts.forEach((g,k)=>g.open=k===i?open:false); render(); break; }
    case "samemsg": S.sameMsg=t.checked; if(S.sameMsg) S.gifts.forEach(g=>{ g.msg=S.gifts[0].msg; g.from=S.gifts[0].from; }); break;
    case "gadd": case "addcart": {
      if(S.sameMsg) S.gifts.forEach(g=>{ g.msg=S.gifts[0].msg; g.from=S.gifts[0].from; });
      const bad=S.gifts.findIndex(g=>!okEmail(g.email)); S.gifts.forEach(g=>g.emailErr=!okEmail(g.email));
      if(bad>-1){ S.gifts.forEach((g,k)=>g.open=k===bad); render(); const el=$("#re"+bad); el&&el.focus(); return; }
      const cur={len:S.offerLen,recips:S.gifts.map(g=>({name:g.name,email:g.email,msg:g.msg,from:g.from}))};
      if(a==="gadd"){ S.addedGifts.push(cur); S.gifts=[blankRecip()]; S.sameMsg=false; S.formTouched=false; render(); return; }
      const groups=[...S.addedGifts,...(formCounted()?[cur]:[])];
      groups.forEach(g=>g.recips.forEach(r=>S.cart.push({label:lenOf(g.len).label.replace("Year","year").replace("Months","months"),price:lenOf(g.len).price,name:r.name,email:r.email})));
      S.addedGifts=[]; S.gifts=[blankRecip()]; S.sameMsg=false; S.formTouched=false; S.ordered=false; go("cart"); return; }
    case "gedit": { if(formHasData()&&S.addedGifts.length) S.addedGifts.push({len:S.offerLen,recips:S.gifts.map(g=>({...g}))}); const g=S.addedGifts.splice(i,1)[0]; S.offerLen=g.len; S.gifts=g.recips.map(r=>Object.assign(blankRecip(),r)); S.gifts[0].open=true; S.formTouched=true; render(); break; }
    case "grm": S.addedGifts.splice(i,1); render(); break;
    case "rmcart": S.cart.splice(i,1); render(); break;
    case "checkout": S.ordered=true; S.cart=[]; render(false); break;
    case "open-signin": S.modal="signin"; render(); break;
    case "open-create": S.modal="create"; render(); break;
    case "closemodal": case "ovclick": S.modal=null; render(); break;
    case "dosignin": Object.assign(S,{signedIn:true,modal:null,step:"confirm",consent:false,consentErr:false}); if(S.account==="new") S.account="inactive"; render(false); break;
    case "docreate": Object.assign(S,{signedIn:true,account:"new",modal:null,step:"confirm",consent:false,consentErr:false}); render(false); break;
    case "signout": Object.assign(S,{signedIn:false,step:"code",modal:null}); render(); break;
    case "continue": {
      if(S.codeError!=="none"){ S.shownErr=S.codeError; S.codeEmpty=false; render(); return; }
      if(!String(S.codeVal).trim()){ S.codeEmpty=true; render(); return; }
      S.codeEmpty=false; S.shownErr=null;
      if(!S.signedIn){ S.modal="signin"; render(); return; }
      S.step="confirm"; render(false); break; }
    case "plan": S.plan=t.dataset.p; render(); break;
    case "consent": S.consent=t.checked; if(S.consent&&S.consentErr){ S.consentErr=false; render(); } break;
    case "changecard": S.changeCard=true; render(); break;
    case "keepcard": S.changeCard=false; render(); break;
    case "redeem": if(S.account!=="active"&&!S.consent){ S.consentErr=true; render(); const c=$("#consent"); c&&c.focus(); return; } S.step="success"; render(false); break;
    case "copy": try{ navigator.clipboard.writeText(CODE).then(()=>toast("Copied "+CODE),()=>toast("Code: "+CODE)); }catch(err){ toast("Code: "+CODE); } break;
    case "toast": toast(t.dataset.msg); break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target; if(!t.dataset||!t.dataset.bind) return;
  if(t.dataset.bind==="codeVal"){ S.codeVal=t.value; return; }
  const g=S.gifts[Number(t.dataset.i)]; if(g) g[t.dataset.bind]=t.value;
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(S.modal){ S.modal=null; render(); } else if(S.panel){ S.panel=false; render(); } } });
window.addEventListener("resize",()=>{ clearTimeout(window.__r); window.__r=setTimeout(()=>render(),120); });
function fromHash(){ const h=(location.hash||"").replace("#",""); if(ROUTES.includes(h)&&h!==S.screen){ if(h==="redeem") startRedeem(S.entry); else go(h); } }
window.addEventListener("hashchange",fromHash);
(function boot(){ const h=(location.hash||"").replace("#",""); if(ROUTES.includes(h)) S.screen=h; render(false); })();
</script>

<script id="pin-title">(function(){var T="redeem-gift";function f(){if(document.title!==T)document.title=T}f();new MutationObserver(f).observe(document.head||document.documentElement,{subtree:true,childList:true,characterData:true});})();</script><script id="route-boot">(function(){try{S.device="auto";S.panel=false;go("offers");window.scrollTo(0,0);}catch(e){console.error("route boot",e)}})();</script></body></html>
