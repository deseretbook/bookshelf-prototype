.crumbs{display:flex;flex-wrap:wrap;gap:6px;padding:14px 16px 0;font-size:11px;color:var(--muted)}
.crumbs button{font-size:11px;color:var(--teal)}
.plp-h{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px}
.plp-h h1{font-family:Lora,Georgia,serif;font-weight:500;font-size:24px;line-height:1.1;margin:0}
.plp-bar{display:flex;align-items:center;justify-content:space-between;padding:0 16px 14px;font-size:12px;color:var(--muted)}
.plp-bar select{border:1px solid var(--hair);border-radius:999px;padding:7px 10px;font-size:11px;background:#fff;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px;padding:0 16px 32px}
.grid .pcard{width:auto}
.empty{padding:48px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{font-size:13px;color:var(--muted);margin:0;max-width:26ch;line-height:1.5}
.pdp-gal{position:relative;background:var(--pearl)}
.pdp-gal .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pdp-gal .track::-webkit-scrollbar{display:none}
.pdp-gal .track>div{min-width:100%;height:340px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.pdp-gal img{width:100%;height:100%;object-fit:contain}
.pdp-gal .dots{position:absolute;left:0;right:0;bottom:8px}
.pdp{padding:20px 16px 8px;display:flex;flex-direction:column;gap:10px}
.pdp h1{font-family:Lora,Georgia,serif;font-weight:500;font-size:24px;line-height:1.2;margin:0;text-wrap:pretty}
.pdp .meta{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pdp .price{font-size:20px;font-weight:500;font-family:Lora,Georgia,serif}
.pdp .rate{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);white-space:nowrap}
.lab{font-size:10px;font-weight:600;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:999px;border:1px solid var(--hair);position:relative}
.sw.on{box-shadow:0 0 0 2px var(--ink);border-color:transparent}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--hair);border-radius:999px;width:fit-content;overflow:hidden}
.qty button{width:44px;height:44px;display:grid;place-items:center}
.qty button:disabled{opacity:.4;cursor:default}
.qty span{min-width:32px;text-align:center;font-size:14px;font-weight:500}
.cta{display:flex;gap:12px;align-items:center}
.cta .btn-gold{flex:1;height:48px}
.cta .fav{width:48px;height:48px;border-radius:8px;border:1px solid var(--hair);display:grid;place-items:center;color:var(--ink)}
.cta .fav.on{color:#a4443f}
.cta .fav.on svg{fill:currentColor}
.acc2{border-top:1px solid var(--hair)}
.acc2 button{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px;font-size:13px;font-weight:600;text-align:left}
.acc2 .body{padding:0 16px 18px;font-size:13px;line-height:1.6;color:#3a3633}
.acc2 .body p{margin:0 0 10px}
.bag{padding:16px 16px 8px;display:flex;flex-direction:column;gap:16px}
.bag h1{font-family:Lora,Georgia,serif;font-weight:500;font-size:24px;margin:0}
.ship{display:flex;flex-direction:column;gap:9px;padding:2px 0 16px}
.ship-t{display:flex;align-items:center;gap:7px;font-size:12px;line-height:1.35;color:var(--ink)}
.ship-t .ic{display:grid;color:var(--ship-accent);flex-shrink:0}
.ship-t strong{font-weight:600}
.ship-bar{display:flex;align-items:center;gap:10px}
.ship-track{flex:1;height:var(--ship-h);border-radius:999px;background:var(--pearl);overflow:hidden}
.ship-track i{display:block;height:100%;border-radius:999px;background:var(--ship-accent);transition:width var(--db-duration-slow) var(--db-ease-standard)}
.ship-seg{flex:1;display:flex;gap:4px}
.ship-seg i{flex:1;height:var(--ship-h);border-radius:999px;background:var(--pearl);transition:background var(--db-duration-base) var(--db-ease-standard)}
.ship-seg i.on{background:var(--ship-accent)}
.ship-goal{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--muted);flex-shrink:0}
.line{display:flex;gap:12px;padding:16px 0;border-top:1px solid var(--hair)}
.line .th{width:64px;height:80px;border-radius:4px;background:var(--pearl);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.line .th img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.line .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.line .t{font-size:13px;line-height:1.3}
.line .c{font-size:11px;color:var(--muted)}
.line .r{display:flex;align-items:center;justify-content:space-between;gap:8px}
.line .qty button{width:32px;height:32px}
.line .rm{font-size:11px;color:var(--muted);text-decoration:underline;align-self:flex-start}
.totals{border-top:1px solid var(--ink);padding-top:16px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.totals .r{display:flex;justify-content:space-between}
.totals .grand{font-weight:600;font-size:15px}
.page{padding:20px 16px 32px;display:flex;flex-direction:column;gap:14px}
.page h1{font-family:Lora,Georgia,serif;font-weight:500;font-size:24px;margin:0}
.page p{font-size:13px;line-height:1.6;color:#3a3633;margin:0;max-width:60ch}
.card-list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--hair)}
.card-list a,.card-list button{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--hair);font-size:13px;color:var(--ink);width:100%;text-align:left}
.skipback{display:flex;align-items:center;gap:6px;padding:14px 16px 0;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition-duration:0ms!important;animation-duration:0ms!important}}
</style>
</head>
