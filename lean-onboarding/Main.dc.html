<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor() {
    super();
    this.state = {
      dropdownOpen: false,
      selected: '',
      datePickerOpen: false,
      dayIdx: 0,
      monthIdx: 0,
      yearIdx: 15,
      dateConfirmed: false
    };
  }
  renderVals() {
    const options = [
      'Deseret Book Store', 'Social Media', 'Blog or Article',
      'Deseret Book Mobile', 'Social Media Influencer',
      'Events/Conferences', 'Family/Friends', 'Church Leader', 'Other'
    ];

    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const allYears = [];
    for (let y = 2015; y >= 1930; y--) allYears.push(y);

    const di = this.state.dayIdx;
    const mi = this.state.monthIdx;
    const yi = this.state.yearIdx;
    const curYear = allYears[yi] || 2000;
    const curMonth = mi + 1;
    const maxDays = new Date(curYear, curMonth, 0).getDate();
    const safeDi = Math.min(di, maxDays - 1);

    const allDays = [];
    for (let d = 1; d <= maxDays; d++) allDays.push(d);

    const makeWheel = (items, selIdx, setFn) => {
      const result = [];
      for (let off = -2; off <= 2; off++) {
        const idx = selIdx + off;
        const abs = Math.abs(off);
        if (idx >= 0 && idx < items.length) {
          result.push({
            label: '' + items[idx],
            color: off === 0 ? '#1c1c1e' : abs === 1 ? 'rgba(60,60,67,0.4)' : 'rgba(60,60,67,0.18)',
            fontSize: off === 0 ? '22px' : '17px',
            fontWeight: off === 0 ? '600' : '400',
            select: () => setFn(idx)
          });
        } else {
          result.push({
            label: ' ',
            color: 'transparent',
            fontSize: '17px',
            fontWeight: '400',
            select: () => {}
          });
        }
      }
      return result;
    };

    const confirmed = this.state.dateConfirmed;
    const displayDay = allDays[safeDi] || 1;

    return {
      yes: true,
      no: false,
      iconSize: 22,
      smallIcon: 20,
      dropdownOpen: this.state.dropdownOpen,
      dropdownSelected: this.state.selected || '',
      showDropdownPlaceholder: !this.state.selected,
      toggleDropdown: () => this.setState({ dropdownOpen: !this.state.dropdownOpen }),
      dropdownOptions: options.map(label => ({
        label,
        select: () => this.setState({ selected: label, dropdownOpen: false })
      })),

      datePickerVisible: this.state.datePickerOpen,
      birthdateSet: confirmed,
      birthdateEmpty: !confirmed,
      birthdateDisplay: confirmed ? String(curMonth).padStart(2, '0') + ' / ' + String(displayDay).padStart(2, '0') + ' / ' + curYear : '',
      dayWheel: makeWheel(allDays, safeDi, (idx) => this.setState({ dayIdx: idx })),
      monthWheel: makeWheel(monthNames, mi, (idx) => this.setState({ monthIdx: idx })),
      yearWheel: makeWheel(allYears, yi, (idx) => this.setState({ yearIdx: idx })),
      openDatePicker: () => this.setState({ datePickerOpen: true }),
      closeDatePicker: () => this.setState({ datePickerOpen: false }),
      confirmDate: () => this.setState({ datePickerOpen: false, dateConfirmed: true, dayIdx: safeDi })
    };
  }
}
</script>
