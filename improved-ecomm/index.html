<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "platinum": false,
  "bookshelf": false,
  "bspPlan": "monthly"
}/*EDITMODE-END*/;
function SubsTweaks() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => { window.DB_SUBS = t; window.dispatchEvent(new CustomEvent("db-subs", { detail: t })); }, [t.platinum, t.bookshelf, t.bspPlan]);
  return (
    <TweaksPanel>
      <TweakSection label="Subscriptions" />
      <TweakToggle label="Platinum Rewards member" value={t.platinum} onChange={(v) => setTweak("platinum", v)} />
      <TweakToggle label="Bookshelf+ subscriber" value={t.bookshelf} onChange={(v) => setTweak("bookshelf", v)} />
      <TweakRadio label="Bookshelf+ plan" value={t.bspPlan} options={["monthly", "yearly"]} onChange={(v) => setTweak("bspPlan", v)} />
    </TweaksPanel>
  );
}
ReactDOM.createRoot(document.getElementById("tweaks-root")).render(<SubsTweaks />);
</script>
