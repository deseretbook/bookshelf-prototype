   out to the banner's edge (100%). The bar previews the stops in that order. */
const SKY_COLORS = ["white", "pearl", "yellow-100", "yellow-200", "yellow-300", "orange-100", "orange-200", "orange-300", "orange-400", "red-100", "red-200", "red-300",

const skyName = (c) => String(c).replace(/-/g, " ").replace(/^[a-z]/, (x) => x.toUpperCase());
function SkyStops({ t, setTweak }) {
  const n = Math.max(2, Math.min(8, t.summer_sunGN | 0));
  const stops = window.DB_SKY_STOPS ? window.DB_SKY_STOPS(Object.fromEntries(Object.keys(t).filter((k) => k.indexOf("summer_sunG") === 0).map((k) => [k.slice(7), t[k]]))) : "";
  const k = (i, x) => "summer_sunG" + i + x;
  return (<>
    <TweakRow label="Sky gradient (sun → edge)">
      <div className="sky-bar" style={{ background: "linear-gradient(90deg," + stops + ")" }}>
        {Array.from({ length: n }, (_, j) => <i key={j} style={{ left: t[k(j + 1, "P")] + "%" }} />)}
      </div>
    </TweakRow>
    <TweakSlider label="Color stops" value={n} min={2} max={8} step={1} onChange={(v) => setTweak("summer_sunGN", v)} />
    {Array.from({ length: n }, (_, j) => { const i = j + 1, c = t[k(i, "C")]; return (
      <div className="sky-stop" key={i}>
        <BrandColorPicker label={"Stop " + i} value={c} onChange={(v) => setTweak(k(i, "C"), v)} />
        <TweakSlider label="Strength (over white)" value={t[k(i, "M")]} min={0} max={100} step={1} unit="%" onChange={(v) => setTweak(k(i, "M"), v)} />
        <TweakSlider label="Position" value={t[k(i, "P")]} min={0} max={100} step={1} unit="%" onChange={(v) => setTweak(k(i, "P"), v)} />
      </div>); })}
  </>);
}

const BRAND_HUES = ["red", "orange", "yellow", "green", "teal", "blue", "purple", "pink"];
const BRAND_VALUES = [100, 200, 300, 400, 500, 600, 700];
function BrandColorPicker({ label, value, onChange }) {
  const [open, setOpen] = React.useState(false);
  const sw = (o) => <button key={o} type="button" role="radio" aria-checked={o === value} aria-label={skyName(o)} title={skyName(o)} data-on={o === value ? "1" : "0"} style={{ background: "var(--db-" + o + ")" }} onClick={() => onChange(o)} />;
  return (
    <div className="bc-pick">
      <button type="button" className="bc-cur" aria-expanded={open} onClick={() => setOpen(!open)}>
        <i style={{ background: "var(--db-" + value + ")" }} />
        <span className="bc-lbl">{label}</span>
        <span className="bc-name">{skyName(value)}</span>
        <span className="twk-ico" aria-hidden="true">{open ? "expand_less" : "expand_more"}</span>
      </button>
      {open && (
        <div className="bc-grid" role="radiogroup" aria-label={label + " color"}>
          <div className="sky-sw bc-n">{BRAND_NEUTRALS.map(sw)}</div>
          <div className="sky-sw bc-h">{BRAND_HUES.map((h) => BRAND_VALUES.map((v) => sw(h + "-" + v)))}</div>
        </div>
      )}
    </div>
  );
}
/* Shape of a banner's radial background: Scale, Roundness (0% = stretched to the banner's proportions, as built;
   100% = a circle; more = taller than wide) and the glow's center. Keys "<season>_bgS/R/Y". */
function BgShape({ t, setTweak, season }) {
  const k = (x) => season + "_bg" + x;
  return (<>
    <TweakSlider label="Scale" value={t[k("S")]} min={30} max={300} step={5} unit="%" onChange={(v) => setTweak(k("S"), v)} />
    <TweakSlider label="Roundness (stretched → circle)" value={t[k("R")]} min={0} max={200} step={5} unit="%" onChange={(v) => setTweak(k("R"), v)} />
    <TweakSlider label="Glow center (from top)" value={t[k("Y")]} min={0} max={200} step={1} unit="%" onChange={(v) => setTweak(k("Y"), v)} />
  </>);
}
/* Background editor for fall, winter and spring (keys "<season>_bg..."): shape, a ground color and its opacity, and up to 8
   stops, each a brand color, its strength over the ground and its position from the glow's center (0%) out to the edge. */
function BgStops({ t, setTweak, season }) {
  const pre = season + "_bg";
  const n = Math.max(2, Math.min(8, t[pre + "N"] | 0));
  const k = (i, x) => pre + i + x;
  const stops = window.DB_BG_STOPS ? window.DB_BG_STOPS(Object.fromEntries(Object.keys(t).filter((x) => x.indexOf(pre) === 0).map((x) => [x.slice(season.length + 1), t[x]]))) : "";
  return (<>
    <TweakRow label="Gradient (center → edge)">
      <div className="sky-bar" style={{ background: "linear-gradient(90deg," + stops + "), #fff" }}>
        {Array.from({ length: n }, (_, j) => <i key={j} style={{ left: t[k(j + 1, "P")] + "%" }} />)}
      </div>
    </TweakRow>
    <BgShape t={t} setTweak={setTweak} season={season} />
    <TweakSection label="Colors" />
    <BrandColorPicker label="Ground" value={t[pre + "G"]} onChange={(v) => setTweak(pre + "G", v)} />
    <TweakSlider label="Ground opacity" value={t[pre + "O"]} min={0} max={100} step={1} unit="%" onChange={(v) => setTweak(pre + "O", v)} />
    <TweakSlider label="Color stops" value={n} min={2} max={8} step={1} onChange={(v) => setTweak(pre + "N", v)} />
    {Array.from({ length: n }, (_, j) => { const i = j + 1; return (
      <div className="sky-stop" key={i}>
        <BrandColorPicker label={"Stop " + i} value={t[k(i, "C")]} onChange={(v) => setTweak(k(i, "C"), v)} />
        <TweakSlider label="Strength (over the ground)" value={t[k(i, "M")]} min={0} max={100} step={1} unit="%" onChange={(v) => setTweak(k(i, "M"), v)} />
        <TweakSlider label="Position" value={t[k(i, "P")]} min={0} max={100} step={1} unit="%" onChange={(v) => setTweak(k(i, "P"), v)} />
      </div>); })}
  </>);
}
function SubsTweaks() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  /* Seasonal banner (the Clearance banner in src/plp.js): one set of motif settings per season (keys "<season>_leaf..."). The
     chosen season's set goes to the banner as a db-leaves event, under the plain leaf... names plp.js reads. */
  const SEASONS = ["fall", "winter", "spring", "summer"];
  const season = SEASONS.indexOf(t.season) > -1 ? t.season : "fall";
  const leafKeys = Object.keys(TWEAK_DEFAULTS).filter((k) => k.indexOf("fall_leaf") === 0).map((k) => k.slice(5));
  const K = (k) => season + "_" + k;
  const leafVals = [season, t.motion !== false].concat(leafKeys.map((k) => t[K(k)]));
  /* Summer's sunrise has its own settings (keys "summer_sun..."), sent along under the plain sun... names. */
  const sunKeys = Object.keys(TWEAK_DEFAULTS).filter((k) => k.indexOf("summer_sun") === 0).map((k) => k.slice(7));
  sunKeys.forEach((k) => leafVals.push(t["summer_" + k]));
  /* Spring's background gradient has its own settings (keys "spring_bg..."), sent along under the plain bg... names. */
  /* Each season's background (keys "<season>_bg..."; summer has only its shape, bgS/R/Y, beside its sky), sent under the plain bg... names. */
  const bgKeys = Object.keys(TWEAK_DEFAULTS).filter((k) => k.indexOf(season + "_bg") === 0).map((k) => k.slice(season.length + 1));
  bgKeys.forEach((k) => leafVals.push(t[K(k)]));
  leafVals.push(bgKeys.length);
  React.useEffect(() => { const d = { season, motion: t.motion !== false }; leafKeys.forEach((k) => { d[k] = t[K(k)]; }); sunKeys.forEach((k) => { d[k] = t["summer_" + k]; }); bgKeys.forEach((k) => { d[k] = t[K(k)]; }); window.DB_LEAVES = d; window.dispatchEvent(new CustomEvent("db-leaves", { detail: d })); }, leafVals);
  const leafReset = () => { const d = {}; (season === "summer" ? sunKeys : leafKeys).concat(bgKeys).forEach((k) => { d[K(k)] = TWEAK_DEFAULTS[K(k)]; }); setTweak(d); };
  const [fcol, setFcol] = React.useState(() => window.DB_FRONT_COLORS || null);
  React.useEffect(() => { const on = (e) => setFcol(e.detail); window.addEventListener("db-front-colors", on); return () => window.removeEventListener("db-front-colors", on); }, []);
  const S = (key, label, min, max, step, unit) => <TweakSlider label={label} value={t[K(key)]} min={min} max={max} step={step || 1} unit={unit || ""} onChange={(v) => setTweak(K(key), v)} />;
  const on = season === "summer" ? t.summer_sunOn : t[K("leafOn")];
  const NOUN = { fall: "leaves", winter: "snowflakes", spring: "petals", summer: "fireflies" }[season];
  const PALETTES = {
    fall: [{ value: "all", label: "Yellows, oranges and reds" }, { value: "yellows", label: "Yellows" }, { value: "oranges", label: "Oranges" }, { value: "reds", label: "Reds" }],
    winter: [{ value: "all", label: "Gradient: white, Dove and Blue 100" }],
    spring: [{ value: "all", label: "Pinks and whites" }, { value: "pinks", label: "Pinks" }, { value: "whites", label: "Whites" }],
    summer: [{ value: "all", label: "Yellows and greens" }, { value: "yellows", label: "Yellows" }, { value: "greens", label: "Greens" }]
  }[season];
  /* Presentation: Phone and Tablet show the site in a device frame (src/presentation.js); Desktop is the page itself. */
  React.useEffect(() => { const d = { viewport: t.viewport || "desktop" }; window.DB_PRESENT = d; window.dispatchEvent(new CustomEvent("db-present", { detail: d })); }, [t.viewport]);
  React.useEffect(() => { window.DB_SUBS = t; window.dispatchEvent(new CustomEvent("db-subs", { detail: t })); }, [t.platinum, t.bookshelf, t.bspPlan, t.bspScenario]);
  return (
    <TweaksPanel>
      {/* Presentation viewport at the top level, as icons (it was the only control in its own menu). */}
      <TweakRadio label="Presentation" value={t.viewport || "desktop"} options={[{ value: "phone", label: "Phone", icon: "smartphone" }, { value: "tablet", label: "Tablet", icon: "tablet" }, { value: "desktop", label: "Desktop", icon: "desktop_windows" }]} onChange={(v) => setTweak("viewport", v)} />
      <TweakLevel id="subs" label="Subscriptions" summary={[t.platinum && "Platinum", t.bookshelf && "Bookshelf+ " + t.bspPlan].filter(Boolean).join(" \u00b7 ") || "None"}>
        <TweakToggle label="Platinum Rewards member" value={t.platinum} onChange={(v) => setTweak("platinum", v)} />
        <TweakLevel id="bsp" label="Bookshelf+" summary={t.bookshelf ? t.bspPlan + " \u00b7 " + { standard: "billed", trial: "trial", gift: "gift" }[t.bspScenario] : "Not subscribed"}>
          <TweakToggle label="Bookshelf+ subscriber" value={t.bookshelf} onChange={(v) => setTweak("bookshelf", v)} />
          <TweakRadio label="Bookshelf+ plan" value={t.bspPlan} options={["monthly", "yearly"]} onChange={(v) => setTweak("bspPlan", v)} />
          <TweakSelect label="Bookshelf+ billing" value={t.bspScenario} options={[{ value: "standard", label: "Billed on deseretbook.com" }, { value: "trial", label: "In free trial" }, { value: "gift", label: "Gift (doesn\u2019t renew)" }]} onChange={(v) => setTweak("bspScenario", v)} />
        </TweakLevel>
      </TweakLevel>
      <TweakLevel id="season" label="Seasonal banner" summary={season.charAt(0).toUpperCase() + season.slice(1) + (on ? "" : " \u00b7 off")}>
        {/* Season switch (icons) first, then Animations: one switch for every season at once. */}
        <TweakRadio label="Season" value={season} options={[{ value: "fall", label: "Fall", icon: "eco" }, { value: "winter", label: "Winter", icon: "ac_unit" }, { value: "spring", label: "Spring", icon: "local_florist" }, { value: "summer", label: "Summer", icon: "sunny" }]} onChange={(v) => setTweak("season", v)} />
        <TweakToggle label="Animations" value={t.motion !== false} onChange={(v) => setTweak("motion", v)} />
        {season === "summer" ? (<>
          <TweakToggle label="Show the sun" value={t.summer_sunOn} onChange={(v) => setTweak("summer_sunOn", v)} />
          <TweakLevel id="sun" label="Sun" summary={t.summer_sunSize + "%"}>
            {S("sunSize", "Sun size", 40, 200, 5, "%")}
            {S("sunGlow", "Glow strength", 0, 150, 5, "%")}
            <TweakSection label="Haloes" />
            {S("sunHalos", "Haloes", 0, 8, 1)}
            {S("sunSpeed", "Halo speed", 25, 300, 5, "%")}
            <TweakSection label="Rays" />
            {S("sunRays", "Rays", 0, 100, 5, "%")}
            {S("sunRayCount", "Ray count", 4, 60, 1)}
          </TweakLevel>
          <TweakLevel id="sky" label="Sky" summary={t.summer_sunGN + " stops"}>
            {S("sunSky", "Sky gradient height", 60, 320, 5, "%")}
            <BgShape t={t} setTweak={setTweak} season="summer" />
            <SkyStops t={t} setTweak={setTweak} />
          </TweakLevel>
          {S("sunBlur", "Blur (over everything)", 0, 40, 1, "px")}
        </>) : (<>
          <TweakToggle label={"Show " + NOUN} value={t[K("leafOn")]} onChange={(v) => setTweak(K("leafOn"), v)} />
          <TweakLevel id="motif" label={NOUN.charAt(0).toUpperCase() + NOUN.slice(1)} summary={(t[K("leafFar")] + t[K("leafMid")] + t[K("leafNear")]) + " \u00b7 " + t[K("leafSize")] + "%"}>
            <TweakSection label="How many" />
            {S("leafFar", "Far " + NOUN, 0, 10)}
            {S("leafMid", "Middle " + NOUN, 0, 8)}
            {S("leafNear", "Near " + NOUN, 0, 6)}
            <TweakSection label="Look" />
            {S("leafSize", "Size", 25, 200, 5, "%")}
            {S("leafPhone", "Size on phones", 20, 100, 5, "%")}
            <TweakSelect label="Colors" value={t[K("leafPalette")]} options={PALETTES} onChange={(v) => setTweak(K("leafPalette"), v)} />
            {S("leafOpacity", "Opacity", 10, 150, 5, "%")}
            {S("leafGlint", "Glimmer (flash in the sun)", 0, 300, 5, "%")}
          </TweakLevel>
          <TweakLevel id="motion" label="Motion" summary={t[K("leafSpeed")] + "% speed"}>
            {S("leafSpeed", "Speed", 25, 300, 5, "%")}
            {S("leafDrift", "Drift (sideways)", 0, 100, 1, "% width")}
            {S("leafSway", "Sway (wind, back and forth)", 0, 100, 1, "%")}
            {S("leafThick", "Thickness (thick at the center, sharp edges)", 0, 100, 1, "%")}
            {S("leafShadow", "Shadow (distant and soft)", 0, 100, 1, "%")}
            <TweakSection label="Spin per pass" />
            {S("leafSpinX", "X rotation amount (per pass)", 0, 720, 5, "\u00b0")}
            {S("leafSpinY", "Y rotation amount (per pass)", 0, 720, 5, "\u00b0")}
            {S("leafSpinZ", "Z rotation amount (per pass)", 0, 720, 5, "\u00b0")}
          </TweakLevel>
          {season === "fall" && <TweakLevel id="front" label="Leaves in front of the text" summary={t.fall_leafFront1 + "% \u00b7 " + t.fall_leafFront2 + "%"}>
            <TweakTimeline label="One whole cycle" lanes={[{ key: "leafFront1", label: "Leaf 1", value: t.fall_leafFront1, color: (fcol && fcol[0]) || "#ebbc4e" }, { key: "leafFront2", label: "Leaf 2", value: t.fall_leafFront2, color: (fcol && fcol[1]) || "#af4904" }]} onChange={(k, v) => setTweak(K(k), v)} />
          </TweakLevel>}
          <TweakLevel id="rotation" label="Rotation">
            {S("leafRotX", "X rotation (tilt back)", -80, 80, 1, "\u00b0")}
            {S("leafRotXVar", "X rotation spread", 0, 90, 1, "\u00b0")}
            {S("leafRotY", "Y rotation (turn sideways)", -80, 80, 1, "\u00b0")}
            {S("leafRotYVar", "Y rotation spread", 0, 90, 1, "\u00b0")}
            {S("leafRotZ", "Z rotation (spin)", -180, 180, 1, "\u00b0")}
            {S("leafRotZVar", "Z rotation spread", 0, 180, 1, "\u00b0")}
          </TweakLevel>
          {season !== "winter" && (
          /* winter's snowflakes stay flat (no curls); their glass mesh has a fixed detail */
          <TweakLevel id="curl" label="Curl and detail" summary={t[K("leafCurlDir")]}>
            {S("leafCurl", "Curl across (width)", 0, 250, 5, "%")}
            {S("leafCurl2", "Curl along (length)", 0, 250, 5, "%")}
            {S("leafCurl3", "Curl diagonal", 0, 250, 5, "%")}
            <TweakRadio label="Curl direction" value={t[K("leafCurlDir")]} options={["mixed", "toward", "away"]} onChange={(v) => setTweak(K("leafCurlDir"), v)} />
            <TweakSection label="Detail" />
            {S("leafCols", "Detail across (columns)", 4, 80, 2)}
            {S("leafRows", "Detail along (rows)", 2, 80, 2)}
          </TweakLevel>
          )}
          <TweakLevel id="focus" label="Focus and blur" summary={t[K("leafSoft")] ? "All soft" : t[K("leafBlur")] + "%"}>
            {S("leafBlur", "Depth of field (blur)", 0, 300, 5, "%")}
            {S("leafFocus", "Focus shift speed", 25, 300, 5, "%")}
            <TweakToggle label="All out of focus" value={t[K("leafSoft")]} onChange={(v) => setTweak(K("leafSoft"), v)} />
            {S("leafSoftAmt", "Out-of-focus blur", 1, 30, 1, "px")}
          </TweakLevel>
          <TweakLevel id="layout" label="Layout" summary={"Seed " + t[K("leafSeed")]}>
            <TweakToggle label={"Keep near " + NOUN + " off the text"} value={t[K("leafClear")]} onChange={(v) => setTweak(K("leafClear"), v)} />
            <TweakNumber label="Layout seed" value={t[K("leafSeed")]} min={1} max={999} step={1} onChange={(v) => setTweak(K("leafSeed"), v)} />
            <TweakButton label="Shuffle layout" secondary onClick={() => setTweak(K("leafSeed"), 1 + Math.floor(Math.random() * 999))} />
          </TweakLevel>
          <TweakLevel id="background" label="Background" summary={skyName(t[K("bg1C")]) + " \u2192 " + skyName(t[K("bgG")])}>
            <BgStops t={t} setTweak={setTweak} season={season} />
          </TweakLevel>
        </>)}
        <TweakButton label={"Reset " + season} secondary onClick={leafReset} />
      </TweakLevel>
    </TweaksPanel>
  );
}
if (!window.DB_FRAME) ReactDOM.createRoot(document.getElementById("tweaks-root")).render(<SubsTweaks />);
</script>
</body>
</html>

<style>/* deploy: Clearance banner without animated elements */.plp-banner .plp-leaves,.plp-banner .plp-sun{display:none!important}.plp-banner,.plp-banner *{animation:none!important;transition:none!important}</style></body></html>
