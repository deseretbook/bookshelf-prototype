<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alternative eComm</title>
<link rel="stylesheet" href="css/site.css">
<script src="js/app.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11.1a1 1 0 0 1-1 .9H7.2a1 1 0 0 1-1-.9L5 8Z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>

<header class="hdr">
  <div class="hdr-in">
    <button class="ibtn hdr-menu" type="button" aria-label="Menu" aria-controls="menu" aria-expanded="false" data-open="menu">
      <svg class="ic"><use href="#i-menu"/></svg>
    </button>
    <a class="logo" href="#">Alternative</a>
    <nav class="nav" aria-label="Main">
      <ul data-menu></ul>
    </nav>
    <button class="ibtn hdr-cart" type="button" aria-controls="cart" aria-expanded="false" data-open="cart" aria-label="Cart, 0 items">
      <svg class="ic"><use href="#i-cart"/></svg>
      <span class="count" data-count hidden>0</span>
    </button>
  </div>
</header>

<main class="main">
  <h1 data-title>Alternative eComm</h1>
  <p>A new store, built from scratch. The menu sits in the header on wide screens and opens as a drawer on small ones. The cart always opens as a drawer.</p>
</main>

<dialog class="drawer drawer-left" id="menu" aria-label="Menu">
  <div class="drawer-h">
    <a class="logo" href="#">Alternative</a>
    <button class="ibtn" type="button" aria-label="Close menu" data-close><svg class="ic"><use href="#i-close"/></svg></button>
  </div>
  <nav class="drawer-b" aria-label="Main">
    <ul class="mnav" data-menu></ul>
  </nav>
</dialog>

<dialog class="drawer drawer-right" id="cart" aria-labelledby="cart-title">
  <div class="drawer-h">
    <h2 class="drawer-title" id="cart-title">Cart (0)</h2>
    <button class="ibtn" type="button" aria-label="Close cart" data-close><svg class="ic"><use href="#i-close"/></svg></button>
  </div>
  <div class="drawer-b">
    <div class="empty">
      <svg class="ic ic-lg" aria-hidden="true"><use href="#i-cart"/></svg>
      <h3>Your cart is empty</h3>
      <p>Items you add will show up here.</p>
      <button class="btn" type="button" data-close>Start shopping</button>
    </div>
  </div>
</dialog>
</body>
</html>
