}}<\/span><sc-if value=\"{{toastUndo}}\" hint-placeholder-val=\"{{false}}\"><button class=\"undo\" sc-camel-on-click=\"{{undo}}\">Undo<\/button><\/sc-if><\/div>\n<\/sc-if>\n\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}\">\nconst Y = { bar: 'var(--system-yellow)', tint: 'rgba(234,170,8,0.30)' };\nconst G = { bar: 'var(--system-green)', tint: 'rgba(23,178,106,0.22)' };\nconst B = { bar: 'var(--system-blue)', tint: 'rgba(21,112,239,0.18)' };\nconst BOOKS = [\n  { id: 'hih', title: 'Hearts in Hiding', author: 'Betsy Brannon Green', cover: '#8C5A3C', lastRead: 1 },\n  { id: 'upg', title: 'Until Proven Guilty', author: 'Betsy Brannon Green', cover: '#3C5A8C', lastRead: 2 },\n  { id: 'abs', title: 'Above Suspicion', author: 'Betsy Brannon Green', cover: '#5E5A54', lastRead: 4 },\n  { id: 'tos', title: 'The Orchard Season', author: 'Margaret Ellison', cover: '#4E6B4A', lastRead: 3 }\n];\nconst ITEMS = [\n  { id: 'h1', kind: 'hl', book: 'hih', ch: 'Chapter 1', text: 'Kate gratefully turned off her computer. She had typed seven wills that day and felt like dying herself.', page: 12, date: 'Today, 2:41 PM', seq: 9, color: Y },\n  { id: 'h2', kind: 'hl', book: 'hih', ch: 'Chapter 1', text: 'The small, windowless room she worked in was stuffy and warm.', page: 14, date: 'Today, 2:42 PM', seq: 10, color: G },\n  { id: 'h3', kind: 'hl', book: 'hih', ch: 'Chapter 4', text: 'He was quiet for a moment. Outside, a car passed slowly, its headlights sweeping across the far wall.', page: 1644, date: 'Yesterday', seq: 6, color: Y },\n  { id: 'h4', kind: 'hl', book: 'hih', ch: 'Chapter 4', text: '“What about it?” he asked at last.', page: 1649, date: 'Today, 3:10 PM', seq: 14, color: B, tags: ['Quote'] },\n  { id: 'h5', kind: 'hl', book: 'upg', ch: 'Chapter 2', text: 'Annabelle’s eyes narrowed as she studied the map pinned to the wall.', page: 1802, date: 'Feb 12', seq: 2, color: Y },\n  { id: 'h6', kind: 'hl', book: 'upg', ch: 'Chapter 2', text: '“Let’s go to lunch before I kill her,” Annabelle muttered to the other ladies.', page: 1805, date: 'Feb 12', seq: 3, color: B },\n  { id: 'h7', kind: 'hl', book: 'abs', ch: 'Chapter 1', text: 'The rain had not let up since noon.', page: 3, date: 'Nov 2', year: 2025, seq: -5, color: G },\n  { id: 'h8', kind: 'hl', book: 'tos', ch: 'Chapter 2', text: 'The orchard was older than the house, and it remembered more.', page: 48, date: 'Jan 8', seq: -3, color: G },\n  { id: 'h9', kind: 'hl', book: 'tos', ch: 'Chapter 5', text: 'Patience, her grandmother said, is just hope that has learned to wait.', page: 131, date: 'Jan 9', seq: -2, color: Y },\n  { id: 'n1', title: 'Chapter 3', kind: 'note', book: 'hih', ch: 'Chapter 3', quote: 'Mary Grace folded the letter and slipped it into her coat.', text: 'Why does she hide the letter? Come back to this later.', page: 1560, date: 'Feb 12', seq: 4, color: Y, tags: ['Lesson idea'] },\n  { id: 'n2', title: 'Henderson place', kind: 'note', book: 'hih', ch: 'Chapter 4', quote: 'The Henderson place had been empty for years.', text: 'Foreshadowing — check back later.', page: 1662, date: 'Yesterday', seq: 7, color: Y, tags: ['To discuss'] },\n  { id: 'n3', title: 'Chapter 2', kind: 'note', book: 'upg', ch: 'Chapter 2', quote: '“Let’s go to lunch before I kill her,” Annabelle muttered', text: 'Loved this quote!', page: 1805, date: 'Today, 2:51 PM', seq: 13, color: Y, tags: ['Quote'] },\n  { id: 'n4', title: 'Sunday lesson', kind: 'note', book: 'tos', ch: 'Chapter 5', quote: 'Patience, her grandmother said, is just hope that has learned to wait.', text: 'Use this for Sunday’s lesson on patience.', page: 131, date: 'Jan 9', seq: -1, color: Y },\n  { id: 'n5', title: 'Chapter 1', kind: 'note', book: 'hih', ch: 'Chapter 1', quote: 'The small, windowless room she worked in was stuffy and warm.', text: 'Reminds me of my first office job downtown.', page: 14, date: 'Feb 12', seq: 1, color: G },\n  { id: 'b1', kind: 'bm', book: 'hih', ch: 'Chapter 1', quote: 'Mary Grace had worked late again, the office nearly dark.', text: 'Chapter 1', page: 12, date: 'Feb 10', seq: 0, color: Y },\n  { id: 'b2', kind: 'bm', book: 'hih', ch: 'Chapter 4', quote: 'The rain had not let up since noon.', text: 'Chapter 4 — the phone call', page: 1649, date: 'Today, 2:54 PM', seq: 12, color: Y },\n  { id: 'b3', kind: 'bm', book: 'abs', ch: 'Chapter 2', quote: '“You’re still here,” Sheriff Thompson said.', text: 'Sheriff’s visit', page: 1655, date: 'Yesterday', seq: 8, color: Y },\n  { id: 'b4', kind: 'bm', book: 'hih', ch: 'Chapter 4', quote: 'Kate checked the lock on the back door twice.', text: 'Locked door', page: 1649, date: 'Feb 12', seq: -6, color: Y },\n  { id: 'b5', kind: 'bm', book: 'hih', ch: 'Chapter 4', quote: 'Somewhere down the hall, a phone began to ring.', text: 'The second call', page: 1649, date: 'Feb 12', seq: -7, color: Y }\n];\nconst TAG_COLORS = [{ name: 'Yellow', hex: '#FADA4D', ink: '#1C1C1E' }, { name: 'Green', hex: '#66C466', ink: '#1C1C1E' }, { name: 'Light Blue', hex: '#7BC4F7', ink: '#1C1C1E' }, { name: 'Blue', hex: '#377CF6', ink: '#FFFFFF' }, { name: 'Pink', hex: '#EC455E', ink: '#FFFFFF' }, { name: 'Purple', hex: '#A55AD8', ink: '#FFFFFF' }, { name: 'Red', hex: '#EB503F', ink: '#FFFFFF' }, { name: 'Orange', hex: '#F39A38', ink: '#1C1C1E' }, { name: 'Brown', hex: '#9E8565', ink: '#FFFFFF' }, { name: 'Gray', hex: '#8E8E93', ink: '#FFFFFF' }];\nconst TAGS = [\n  { id: 'quote', name: 'Quote', color: '#EB503F', items: [\n    { book: 'Hearts in Hiding', ch: 'Ch. 4', text: '“Slow, but steady,” she replied.', date: 'Today, 2:55 PM', page: 1646, color: Y },\n    { book: 'Hearts in Hiding', ch: 'Ch. 4', text: '“Someone has to finish the files.”', date: 'Today, 3:01 PM', page: 1652, color: G },\n    { book: 'Until Proven Guilty', ch: 'Ch. 2', text: 'Annabelle’s eyes narrowed.', date: 'Today, 2:46 PM', page: 1803, color: Y } ] },\n  { id: 'lesson', na
