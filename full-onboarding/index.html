<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bookshelf+ Full Onboarding</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f2f2f7; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #frame {
    width: 390px;
    height: 844px;
    transform-origin: top center;
    position: relative;
    background: #fff;
    overflow: hidden;
    border-radius: 0;
  }
  #frame iframe {
    width: 390px;
    height: 844px;
    border: none;
    display: block;
  }
</style>
</head>
<body>
<div id="frame">
  <iframe id="screen" src="Main-9nrw.dc.html"></iframe>
</div>
<script>
(function() {
  var frame = document.getElementById('frame');
  var iframe = document.getElementById('screen');
  var DESIGN_W = 390;
  var DESIGN_H = 844;

  function resize() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var scaleW = vw / DESIGN_W;
    var scaleH = vh / DESIGN_H;
    var scale = Math.min(scaleW, scaleH, 1);
    frame.style.transform = 'scale(' + scale + ')';
    var scaledW = DESIGN_W * scale;
    var scaledH = DESIGN_H * scale;
    frame.style.marginTop = ((vh - scaledH) / 2) + 'px';
    frame.style.marginLeft = ((vw - scaledW) / 2) + 'px';
  }

  window.addEventListener('resize', resize);
  resize();

  iframe.addEventListener('load', function() {
    try {
      var doc = iframe.contentDocument || iframe.contentWindow.document;
      var links = doc.querySelectorAll('a[href$=".dc.html"]');
      links.forEach(function(link) {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          var href = link.getAttribute('href');
          iframe.src = href;
        });
      });
    } catch(e) {}
  });
})();
</script>
</body>
</html>
