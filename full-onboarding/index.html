<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bookshelf+ Full Onboarding</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 100%; min-height: 100%; background: #e5e5ea; }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px 40px;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .device {
    transform-origin: top center;
    flex-shrink: 0;
  }

  .phone-frame {
    width: 410px;
    padding: 14px 10px 14px;
    background: #1d1d1f;
    border-radius: 54px;
    position: relative;
    box-shadow:
      inset 0 0 0 2px #3a3a3c,
      0 30px 80px rgba(0,0,0,0.35),
      0 0 0 1px rgba(0,0,0,0.15);
  }

  .notch {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 37px;
    background: #1d1d1f;
    border-radius: 20px;
    z-index: 10;
  }

  .home-bar {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 5px;
    background: rgba(255,255,255,0.25);
    border-radius: 3px;
    z-index: 10;
  }

  .screen-wrap {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    overflow: hidden;
    background: #fff;
  }

  .screen-wrap iframe {
    width: 390px;
    height: 844px;
    border: none;
    display: block;
  }

  .side-btn {
    position: absolute;
    background: #2c2c2e;
    border-radius: 2px;
  }
  .btn-silent { width: 3px; height: 28px; top: 120px; left: -3px; }
  .btn-vol-up { width: 3px; height: 54px; top: 170px; left: -3px; }
  .btn-vol-dn { width: 3px; height: 54px; top: 234px; left: -3px; }
  .btn-power { width: 3px; height: 80px; top: 190px; right: -3px; }
</style>
</head>
<body>
<div class="device" id="device">
  <div class="phone-frame">
    <div class="notch"></div>
    <div class="side-btn btn-silent"></div>
    <div class="side-btn btn-vol-up"></div>
    <div class="side-btn btn-vol-dn"></div>
    <div class="side-btn btn-power"></div>
    <div class="screen-wrap">
      <iframe id="screen" src="Main-9nrw.dc.html"></iframe>
    </div>
    <div class="home-bar"></div>
  </div>
</div>
<script>
(function() {
  var device = document.getElementById('device');
  var iframe = document.getElementById('screen');
  var DEVICE_W = 416;

  function resize() {
    var vw = window.innerWidth;
    var available = vw - 32;
    var scale = Math.min(available / DEVICE_W, 1);
    device.style.transform = 'scale(' + scale + ')';
  }

  window.addEventListener('resize', resize);
  resize();

  iframe.addEventListener('load', function() {
    try {
      var doc = iframe.contentDocument || iframe.contentWindow.document;
      var links = doc.querySelectorAll('a[href$=".dc.html"]');
      links.forEach(function(link) {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          iframe.src = link.getAttribute('href');
        });
      });
    } catch(e) {}
  });
})();
</script>
</body>
</html>
