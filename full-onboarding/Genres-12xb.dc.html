<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick Genres</title>

<link rel="stylesheet" href="ds/deseret-bookshelf/styles.css">
<link rel="stylesheet" href="ds/deseret-bookshelf/tokens/fonts.css">

</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; font-family: -apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif; }
a { color: var(--brand, #0C958B); text-decoration: none; }

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fff; display: flex; flex-direction: column;">

  <div style="background: #fff;">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 24px 0; font-size: 15px; font-weight: 600; color: #1c1c1e;">
      <span>9:41</span>
      <div style="display: flex; align-items: center; gap: 6px;">
        <svg width="17" height="12" viewBox="0 0 17 12"><path d="M15.5 0.5h-1c-0.28 0-0.5 0.22-0.5 0.5v10c0 0.28 0.22 0.5 0.5 0.5h1c0.28 0 0.5-0.22 0.5-0.5V1c0-0.28-0.22-0.5-0.5-0.5z" fill="#1c1c1e"></path><path d="M11.5 2.5h-1c-0.28 0-0.5 0.22-0.5 0.5v8c0 0.28 0.22 0.5 0.5 0.5h1c0.28 0 0.5-0.22 0.5-0.5V3c0-0.28-0.22-0.5-0.5-0.5z" fill="#1c1c1e"></path><path d="M7.5 4.5h-1c-0.28 0-0.5 0.22-0.5 0.5v6c0 0.28 0.22 0.5 0.5 0.5h1c0.28 0 0.5-0.22 0.5-0.5V5c0-0.28-0.22-0.5-0.5-0.5z" fill="#1c1c1e"></path><path d="M3.5 6.5h-1c-0.28 0-0.5 0.22-0.5 0.5v4c0 0.28 0.22 0.5 0.5 0.5h1c0.28 0 0.5-0.22 0.5-0.5V7c0-0.28-0.22-0.5-0.5-0.5z" fill="#1c1c1e"></path></svg>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 3.6c1.8 0 3.4 0.7 4.6 1.9l1.4-1.4C12.2 2.3 10.2 1.4 8 1.4S3.8 2.3 2 4.1l1.4 1.4C4.6 4.3 6.2 3.6 8 3.6z" fill="#1c1c1e"></path><path d="M8 7.2c1 0 2 0.4 2.7 1.1l1.4-1.4C10.8 5.6 9.5 5 8 5s-2.8 0.6-4.1 1.9l1.4 1.4C6 7.6 7 7.2 8 7.2z" fill="#1c1c1e"></path><circle cx="8" cy="10.5" r="1.5" fill="#1c1c1e"></circle></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="21" height="10" rx="2" stroke="#1c1c1e" stroke-width="1" fill="none"></rect><rect x="2" y="3" width="16" height="6" rx="1" fill="#1c1c1e"></rect><path d="M23 4.5v3c0.8-0.3 1.3-1 1.3-1.5s-0.5-1.2-1.3-1.5z" fill="#1c1c1e"></path></svg>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: flex-end; padding: 4px 16px 8px;">
      <a href="PushPermission-8eur.dc.html" style="display: flex; align-items: center; justify-content: center; width: 64px; height: 44px; padding: 0 8px; font-size: 15px; font-weight: 500; color: var(--brand, #0C958B); box-sizing: border-box;">Skip</a>
    </div>

    <div style="display: flex; gap: 4px; padding: 0 24px 16px;">
      <div style="flex: 1; height: 4px; border-radius: 2px; background: var(--brand, #0C958B);"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: rgba(60,60,67,0.12);"></div>
    </div>

    <div style="padding: 0 24px 16px;">
      <h1 style="margin: 0 0 4px; font-size: 28px; font-weight: 700; color: #1c1c1e; letter-spacing: -0.4px;">Pick Genres You Love</h1>
      <p style="margin: 0; font-size: 15px; color: #8e8e93; line-height: 1.4;">Choose 1–5. You can change these anytime in your App Settings in Account.</p>
    </div>
  </div>

  <div style="flex: 1; padding: 12px 24px 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{genres}}" as="g">
      <button onClick="{{g.toggle}}" style="display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 56px; padding: 0 16px; border-radius: 14px; border: 1.5px solid {{g.borderColor}}; background: {{g.bg}}; cursor: pointer; font-family: inherit; box-sizing: border-box; transition: all 0.15s ease;">
        <span style="font-size: 16px; font-weight: 500; color: #1c1c1e;">{{g.label}}</span>
        <div style="width: 24px; height: 24px; border-radius: 6px; border: 2px solid {{g.checkBorder}}; background: {{g.checkBg}}; display: flex; align-items: center; justify-content: center; transition: all 0.15s ease; flex-shrink: 0;">
          <sc-if value="{{g.isOn}}">
            <svg width="14" height="10" viewBox="0 0 14 10"><path d="M1 5l4 4L13 1" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </sc-if>
        </div>
      </button>
    </sc-for>
  </div>

  <div style="padding: 12px 24px 40px; background: #fff;">
    <sc-if value="{{canContinue}}">
      <a href="PushPermission-8eur.dc.html" style="display: block; width: 100%; height: 50px; border-radius: 25px; background: var(--brand, #0C958B); color: #fff; font-size: 17px; font-weight: 600; text-align: center; line-height: 50px;">Continue</a>
    </sc-if>
    <sc-if value="{{disableContinue}}">
      <div style="width: 100%; height: 50px; border-radius: 25px; background: rgba(12,149,139,0.35); color: rgba(255,255,255,0.7); font-size: 17px; font-weight: 600; text-align: center; line-height: 50px;">Continue</div>
    </sc-if>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor() {
    super();
    this.state = { selected: {} };
  }
  renderVals() {
    const allGenres = [
      'Fiction', 'Fantasy', 'Romance', 'Gospel Voices',
      'General Authority', 'Inspiration', 'Church History',
      'Nonfiction', 'Church Resources', 'Self-Help',
      'Biography', 'Youth', 'Children'
    ];
    const sel = this.state.selected;
    const count = Object.keys(sel).length;
    return {
      canContinue: count >= 1,
      disableContinue: count < 1,
      genres: allGenres.map(label => {
        const isOn = !!sel[label];
        return {
          label,
          isOn,
          bg: isOn ? 'rgba(12,149,139,0.04)' : '#fff',
          borderColor: isOn ? 'var(--brand, #0C958B)' : 'rgba(60,60,67,0.12)',
          checkBorder: isOn ? 'var(--brand, #0C958B)' : 'rgba(60,60,67,0.25)',
          checkBg: isOn ? 'var(--brand, #0C958B)' : 'transparent',
          toggle: () => {
            const next = Object.assign({}, sel);
            if (next[label]) {
              delete next[label];
            } else if (count < 5) {
              next[label] = true;
            }
            this.setState({ selected: next });
          }
        };
      })
    };
  }
}
</script>
</body>
</html>
